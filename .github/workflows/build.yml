name: Build DMG
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Choose version
        run: |
          version="$(cat VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF#refs/tags/v}"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid version'; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$version" == "$(cat VERSION)" ]] || { echo 'Tag and VERSION disagree'; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Reject non-increasing release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [[ -n "$previous" ]]; then
            python3 - "$VERSION" "${previous#v}" <<'PY'
          import sys
          current, previous = (tuple(map(int, value.split('.'))) for value in sys.argv[1:])
          if current <= previous:
              raise SystemExit('Release version must increase beyond latest published release')
          PY
          fi
      - name: Choose release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          if [[ -n "$CERTIFICATE" ]]; then
            for required in CERTIFICATE_PASSWORD IDENTITY APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
              [[ -n "${!required}" ]] || { echo "Missing $required for Developer ID release"; exit 1; }
            done
          else
            echo 'Publishing ad-hoc builds without Apple notarization.'
          fi
          if [[ -n "$SPARKLE_KEY" ]]; then
            echo 'SIGN_UPDATE_FEED=true' >> "$GITHUB_ENV"
          else
            echo 'SIGN_UPDATE_FEED=false' >> "$GITHUB_ENV"
            echo '::notice::Sparkle key is not configured. The installer release will stay a draft until signed feeds are added.'
          fi
      - name: Test Go and Swift
        run: |
          go test -race ./...
          go vet ./...
          make check-ui
      - name: Import optional Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [[ -z "$CERTIFICATE" ]]; then
            echo 'Building with ad-hoc signing (not notarized).'
            exit 0
          fi
          [[ -n "$IDENTITY" ]] || { echo 'Missing MACOS_SIGNING_IDENTITY'; exit 1; }
          keychain="$RUNNER_TEMP/sleepguard-build.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build installer
        run: |
          make dmg
          python3 scripts/check-package.py
      - name: Optional notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "${SIGNING_IDENTITY:-}" || -z "$APPLE_ID" || -z "$APPLE_APP_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo 'Notarization skipped; Developer ID and all Apple credentials are required.'
            exit 0
          fi
          image="dist/SleepGuard-$VERSION-$ARCH.dmg"
          xcrun notarytool submit "$image" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$image"
          xcrun stapler validate "$image"
          (cd dist && shasum -a 256 "$(basename "$image")" > "$(basename "$image").sha256")
      - name: Create signed update feed
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGN_UPDATE_FEED == 'true'
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: scripts/build-appcast.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: SleepGuard-${{ env.VERSION }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/appcast-*.xml
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/sleepguard-build.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/sleepguard-build.keychain-db"
          fi
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release/*.dmg release/*.sha256 release/appcast-*.xml)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --draft --title "SleepGuard $GITHUB_REF_NAME" --notes-file docs/release-notes.md
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets.txt"
          python3 - "$RUNNER_TEMP/release-assets.txt" <<'PY'
          from pathlib import Path
          import sys
          actual = set(Path(sys.argv[1]).read_text().splitlines())
          expected = {path.name for pattern in ('*.dmg', '*.sha256', 'appcast-*.xml') for path in Path('release').glob(pattern)}
          feeds = list(Path('release').glob('appcast-*.xml'))
          if len(expected) not in (4, 6) or len(feeds) not in (0, 2) or actual != expected:
              raise SystemExit(f'Release assets incomplete: expected {sorted(expected)}, got {sorted(actual)}')
          PY
          if [[ -f release/appcast-arm64.xml && -f release/appcast-x86_64.xml ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            echo '::notice::Draft ready. Sign both exact DMGs using the local Keychain, attach appcast-arm64.xml and appcast-x86_64.xml, then publish.'
          fi
